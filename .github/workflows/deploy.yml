name: Build & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply migrations & deploy functions
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: hpqvaaujwwozkcgnwvnc
        run: |
          # Apply pending migrations
          supabase db push --db-url "$SUPABASE_DB_URL"
          # Deploy edge functions
          supabase functions deploy request-account --project-ref $SUPABASE_PROJECT_REF
          supabase functions deploy approve-account-request --project-ref $SUPABASE_PROJECT_REF
          supabase functions deploy send-invitation --project-ref $SUPABASE_PROJECT_REF
          supabase functions deploy accept-invitation --project-ref $SUPABASE_PROJECT_REF
          # Set function secrets
          supabase secrets set RESEND_API_KEY=${{ secrets.RESEND_API_KEY }} SITE_URL=${{ secrets.VITE_SITE_URL }} --project-ref $SUPABASE_PROJECT_REF

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-supabase
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Deploy dist/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          keep_files: false
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }}"
