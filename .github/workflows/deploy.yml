name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        # Vite copies public/ → dist/ automatically, so data/, reporting-data/,
        # promise-v8-dashboard.html, and mma-logo.png are all included.

      - name: Deploy dist/ → gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          # Clean deploy — removes stale bundles from previous builds
          keep_files: false
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }}"
