name: Horizon Signal — Weekly Auto-Publish

# Runs every Monday at 6:00 AM EST (11:00 UTC)
on:
  schedule:
    - cron: '0 11 * * 1'
  workflow_dispatch:   # manual trigger for testing / backfills

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install anthropic psycopg2-binary

      - name: Generate and publish digest
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL:   ${{ secrets.SUPABASE_DB_URL }}
        run: python .github/scripts/publish_horizon_signal.py

      - name: Notify Discord on success
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.HORIZON_SIGNAL_DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"📡 **Horizon Signal published** — \`$(date -u +%Y-%m-%d)\`\\nNew edition is live on the tracker.\"}" || true

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.HORIZON_SIGNAL_DISCORD_WEBHOOK }}
        run: |
          curl -s -X POST "$DISCORD_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"🚨 **Horizon Signal publish FAILED** — \`$(date -u +%Y-%m-%d)\`\\nCheck GH Actions logs.\"}" || true
